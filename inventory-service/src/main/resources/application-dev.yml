spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: ecommerce
    password: ecommerce
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.clodoaldo: DEBUG

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0